name: CI-BUILD
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      build-version:
        description: Provide a version
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.build-version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      -
        name: Verify tag matches package.json
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG_VERSION="$(jq -r .version package.json)"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push BeerLog
        uses: docker/build-push-action@v6
        with:
          file: ./infra/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/robbash/beerlog:latest
            ghcr.io/robbash/beerlog:${{ steps.version.outputs.version }}
